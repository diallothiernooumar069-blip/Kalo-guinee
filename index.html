<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalo Guinée 🇬🇳</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }
    
    header {
      background: #0b7a3b;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #0b7a3b;
    }

    input, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      background: #0b7a3b;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #096532;
    }

    .annonce {
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
    }

    .prix {
      color: #0b7a3b;
      font-size: 20px;
      font-weight: bold;
      margin-top: 5px;
    }

    .ville {
      color: #666;
      margin-top: 5px;
    }

    #message {
      margin-top: 12px;
      font-weight: bold;
    }

    .recherche {
      margin-bottom: 20px;
    }

    .aucune {
      text-align: center;
      color: #777;
      padding: 20px;
    }
  </style>
</head>

<body>
  
<div class="box">
  <h2>🔐 Connexion vendeur</h2>

  <input id="email" type="email" placeholder="Adresse e-mail">

  <input id="motDePasse" type="password" placeholder="Mot de passe">

  <button onclick="creerCompte()">Créer mon compte</button>

  <button onclick="seConnecter()">Se connecter</button>

  <button onclick="seDeconnecter()">Se déconnecter</button>

  <div id="authMessage"></div>
</div>
  
<header>
  <h1>🇬🇳 Kalo Guinée</h1>
  <p>Acheter, vendre et trouver des opportunités en Guinée</p>
</header>

<div class="container">

  <div class="box">
    <h2>🛍️ Publier une annonce</h2>

    <input id="nom" type="text" placeholder="Nom du produit">
    
    <input id="prix" type="number" placeholder="Prix en GNF">
    <input id="telephone" type="tel" placeholder="Numéro de téléphone">
    <input id="photo" type="file" accept="image/*">
    
    <select id="ville">
      <option value="">Choisir une ville</option>
      <option>Conakry</option>
      <option>Kindia</option>
      <option>Labé</option>
      <option>Mamou</option>
      <option>Kankan</option>
      <option>N'zérékoré</option>
      <option>Boké</option>
      <option>Faranah</option>
    </select>

    <button onclick="publierAnnonce()">Publier l'annonce</button>

    <div id="message"></div>
  </div>

  <div class="box">
    <h2>🔎 Rechercher une annonce</h2>

    <input
      id="recherche"
      type="text"
      placeholder="Exemple : téléphone, voiture, maison..."
      oninput="filtrerAnnonces()"
    >

    <select id="filtreVille" onchange="filtrerAnnonces()">
      <option value="">Toutes les villes</option>
      <option>Conakry</option>
      <option>Kindia</option>
      <option>Labé</option>
      <option>Mamou</option>
      <option>Kankan</option>
      <option>N'zérékoré</option>
      <option>Boké</option>
      <option>Faranah</option>
    </select>
  </div>

  <div class="box">
    <h2>📋 Annonces disponibles</h2>

    <div id="annonces">
      Chargement des annonces...
    </div>
  </div>

</div>

<script type="module">

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

  import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBpt3SFlC8uHi59v4_wd8HiVN-ZhqgMFPk",
    authDomain: "kalo-guinee.firebaseapp.com",
    projectId: "kalo-guinee",
    storageBucket: "kalo-guinee.firebasestorage.app",
    messagingSenderId: "21878004061",
    appId: "1:21878004061:web:402d32ef967f0ceaaef0b4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  
  let toutesLesAnnonces = [];

  window.creerCompte = async function() {
  const email = document.getElementById("email").value.trim();
  const motDePasse = document.getElementById("motDePasse").value;
  const message = document.getElementById("authMessage");

  if (!email || !motDePasse) {
    message.style.color = "red";
    message.textContent = "⚠️ Remplis l'e-mail et le mot de passe.";
    return;
  }

  try {
    await createUserWithEmailAndPassword(auth, email, motDePasse);

    message.style.color = "green";
    message.textContent = "✅ Compte vendeur créé avec succès !";

  } catch (error) {
    console.error(error);

    message.style.color = "red";
    message.textContent = "❌ " + error.message;
  }
};
window.seConnecter = async function() {
  const email = document.getElementById("email").value.trim();
  const motDePasse = document.getElementById("motDePasse").value;
  const message = document.getElementById("authMessage");

  if (!email || !motDePasse) {
    message.style.color = "red";
    message.textContent = "⚠️ Remplis l'e-mail et le mot de passe.";
    return;
  }

  try {
    await signInWithEmailAndPassword(auth, email, motDePasse);

alert("✅ Connexion réussie !");

    message.style.color = "green";
    message.textContent = "✅ Connexion réussie !";

  } catch (error) {
    console.error(error);

    message.style.color = "red";
    message.textContent = "❌ E-mail ou mot de passe incorrect.";
  }
};


window.seDeconnecter = async function() {
  const message = document.getElementById("authMessage");

  try {
    await signOut(auth);

    message.style.color = "green";
    message.textContent = "✅ Vous êtes déconnecté.";

  } catch (error) {
    console.error(error);

    message.style.color = "red";
    message.textContent = "❌ Erreur lors de la déconnexion.";
  }
};

  window.publierAnnonce = async function() {
  const utilisateur = auth.currentUser;

if (!utilisateur) {
  const message = document.getElementById("message");
  message.style.color = "red";
  message.textContent = "🔐 Connecte-toi en tant que vendeur avant de publier.";
  return;
}

    const nom = document.getElementById("nom").value.trim();
const prix = document.getElementById("prix").value;
    const telephone = document.getElementById("telephone").value.trim();
const ville = document.getElementById("ville").value;
const photo = document.getElementById("photo").files[0];
const message = document.getElementById("message");

    if (!nom || !prix || !telephone || !ville) {
      message.style.color = "red";
      message.textContent = "⚠️ Remplis tous les champs.";
      return;
    }
try {

  let imageUrl = "";

  if (photo) {

    const formData = new FormData();

    formData.append("file", photo);
    formData.append("upload_preset", "kalo_photos");

    const cloudinaryResponse = await fetch(
      "https://api.cloudinary.com/v1_1/kkacibse/image/upload",
      {
        method: "POST",
        body: formData
      }
    );

    const imageData = await cloudinaryResponse.json();

    if (!cloudinaryResponse.ok) {
      throw new Error(
        imageData.error?.message || "Erreur lors de l'envoi de la photo."
      );
    }

    imageUrl = imageData.secure_url;
  }

  await addDoc(collection(db, "annonces"), {
  nom: nom,
  prix: Number(prix),
  ville: ville,
  telephone: telephone,
  imageUrl: imageUrl,
  vendeurEmail: utilisateur.email,
  vendeurId: utilisateur.uid,
  date: new Date()
});
    

      message.style.color = "green";
      message.textContent = "✅ Annonce publiée avec succès !";

      document.getElementById("nom").value = "";
      document.getElementById("prix").value = "";
      document.getElementById("telephone").value = "";
      document.getElementById("ville").value = "";
      document.getElementById("photo").value = "";
      await chargerAnnonces();

    } catch (error) {

      console.error(error);

      message.style.color = "red";
message.textContent = "❌ Erreur : " + error.message;
      

    }

  };

  async function chargerAnnonces() {
    const zone = document.getElementById("annonces");

    try {
      zone.innerHTML = "Chargement des annonces...";

      const resultat = await getDocs(collection(db, "annonces"));

      toutesLesAnnonces = [];

      resultat.forEach((documentAnnonce) => {
        toutesLesAnnonces.push({
          id: documentAnnonce.id,
          ...documentAnnonce.data()
        });
      });

      // Afficher les annonces les plus récentes en premier.
      toutesLesAnnonces.sort((a, b) => {
        const dateA = a.date?.toDate
          ? a.date.toDate().getTime()
          : 0;

        const dateB = b.date?.toDate
          ? b.date.toDate().getTime()
          : 0;

        return dateB - dateA;
      });

      filtrerAnnonces();

    } catch (error) {
      console.error("Erreur de chargement :", error);
      zone.textContent = "❌ Impossible de charger les annonces.";
    }
  }

  window.filtrerAnnonces = function() {
    const recherche = document
      .getElementById("recherche")
      .value.toLowerCase()
      .trim();

    const ville = document.getElementById("filtreVille").value;

    const resultats = toutesLesAnnonces.filter((annonce) => {
      const nom = String(annonce.nom || "").toLowerCase();

      const correspondRecherche = nom.includes(recherche);
      const correspondVille = !ville || annonce.ville === ville;

      return correspondRecherche && correspondVille;
    });

    afficherAnnonces(resultats);
  };

  function afficherAnnonces(annonces) {
    const zone = document.getElementById("annonces");
    zone.innerHTML = "";

    // ⭐ Afficher les annonces sponsorisées en premier
    annonces.sort((a, b) => {
        if (a.sponsorise && !b.sponsorise) return -1;
        if (!a.sponsorise && b.sponsorise) return 1;
        return 0;
    });

    if (annonces.length === 0) {
      zone.innerHTML =
        '<div class="aucune">Aucune annonce trouvée.</div>';
      return;
    }

    annonces.forEach((annonce) => {
      const div = document.createElement("div");
      div.className = "annonce";

      const nom = String(annonce.nom || "Sans nom");
      const telephone = String(annonce.telephone || "");
      const ville = String(annonce.ville || "Ville inconnue");
      const prix = Number(annonce.prix || 0).toLocaleString("fr-FR");

      const titre = document.createElement("h3");
      titre.textContent = nom;
      div.appendChild(titre);

      if (annonce.imageUrl) {
        const image = document.createElement("img");
        image.src = annonce.imageUrl;
        image.alt = nom;
        image.style.width = "100%";
        image.style.maxHeight = "300px";
        image.style.objectFit = "cover";
        image.style.borderRadius = "10px";
        image.style.marginBottom = "10px";
        div.appendChild(image);
      }

      const prixDiv = document.createElement("div");
      prixDiv.className = "prix";
      prixDiv.textContent = prix + " GNF";
      div.appendChild(prixDiv);

      const villeDiv = document.createElement("div");
      villeDiv.className = "ville";
      villeDiv.textContent = "📍 " + ville;
      div.appendChild(villeDiv);
            // Boutons visibles uniquement pour le propriétaire connecté.
      if (
        auth.currentUser &&
        annonce.vendeurId === auth.currentUser.uid
      ) {
        const actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.gap = "10px";
        actions.style.marginTop = "12px";

        const boutonModifier = document.createElement("button");
        boutonModifier.textContent = "✏️ Modifier";
        boutonModifier.style.flex = "1";

        boutonModifier.onclick = () => modifierAnnonce(annonce);

        const boutonSupprimer = document.createElement("button");
        boutonSupprimer.textContent = "🗑️ Supprimer";
        boutonSupprimer.style.flex = "1";
        boutonSupprimer.style.background = "#c62828";

        boutonSupprimer.onclick = () => supprimerAnnonce(annonce);

        actions.appendChild(boutonModifier);
        actions.appendChild(boutonSupprimer);
        div.appendChild(actions);
      }

      if (telephone) {
        const numero = document.createElement("p");
        numero.textContent = "📞 " + telephone;
        div.appendChild(numero);

        const boutons = document.createElement("div");
        boutons.style.display = "flex";
        boutons.style.gap = "10px";
        boutons.style.marginTop = "10px";

        const appel = document.createElement("a");
        appel.href = "tel:" + telephone;
        appel.textContent = "📞 Appeler";
        appel.style.cssText =
          "flex:1;background:#0a8f3d;color:white;padding:12px;border-radius:8px;text-align:center;text-decoration:none;font-weight:bold;";

        const whatsapp = document.createElement("a");
        whatsapp.href =
          "https://wa.me/" + telephone.replace(/\D/g, "");
        whatsapp.target = "_blank";
        whatsapp.rel = "noopener noreferrer";
        whatsapp.textContent = "💬 WhatsApp";
        whatsapp.style.cssText =
          "flex:1;background:#25D366;color:white;padding:12px;border-radius:8px;text-align:center;text-decoration:none;font-weight:bold;";

        boutons.appendChild(appel);
        boutons.appendChild(whatsapp);
        div.appendChild(boutons);
      }

      zone.appendChild(div);
    });
  }
   // MODIFIER UNE ANNONCE
  window.modifierAnnonce = async function(annonce) {
    const utilisateur = auth.currentUser;

    if (!utilisateur || utilisateur.uid !== annonce.vendeurId) {
      alert("⛔ Tu ne peux modifier que tes propres annonces.");
      return;
    }

    const nouveauNom = prompt(
      "Nom du produit :",
      annonce.nom || ""
    );

    if (nouveauNom === null) return;

    const nouveauPrix = prompt(
      "Prix en GNF :",
      annonce.prix || ""
    );

    if (nouveauPrix === null) return;

    const nouveauTelephone = prompt(
      "Numéro de téléphone :",
      annonce.telephone || ""
    );

    if (nouveauTelephone === null) return;

    const nouvelleVille = prompt(
      "Ville :",
      annonce.ville || ""
    );

    if (nouvelleVille === null) return;

    if (
      !nouveauNom.trim() ||
      !nouveauPrix.trim() ||
      !nouveauTelephone.trim() ||
      !nouvelleVille.trim() ||
      !Number.isFinite(Number(nouveauPrix)) ||
      Number(nouveauPrix) <= 0
    ) {
      alert("⚠️ Vérifie les informations et le prix.");
      return;
    }

    const villesAutorisees = [
      "Conakry",
      "Kindia",
      "Labé",
      "Mamou",
      "Kankan",
      "N'zérékoré",
      "Boké",
      "Faranah"
    ];

    if (!villesAutorisees.includes(nouvelleVille.trim())) {
      alert("⚠️ Choisis une ville proposée sur Kalo Guinée.");
      return;
    }

    try {
      await updateDoc(doc(db, "annonces", annonce.id), {
        nom: nouveauNom.trim(),
        prix: Number(nouveauPrix),
        telephone: nouveauTelephone.trim(),
        ville: nouvelleVille.trim()
      });

      alert("✅ Annonce modifiée avec succès !");
      await chargerAnnonces();

    } catch (error) {
      console.error("Erreur de modification :", error);
      alert("❌ Impossible de modifier l'annonce. Vérifie les règles Firestore.");
    }
  };


  // SUPPRIMER UNE ANNONCE
  window.supprimerAnnonce = async function(annonce) {
    const utilisateur = auth.currentUser;

    if (!utilisateur || utilisateur.uid !== annonce.vendeurId) {
      alert("⛔ Tu ne peux supprimer que tes propres annonces.");
      return;
    }

    const confirmation = confirm(
      'Veux-tu vraiment supprimer l’annonce "' +
      annonce.nom +
      '" ? Cette action est irréversible.'
    );

    if (!confirmation) return;

    try {
      await deleteDoc(doc(db, "annonces", annonce.id));

      alert("✅ Annonce supprimée avec succès !");
      await chargerAnnonces();

    } catch (error) {
      console.error("Erreur de suppression :", error);
      alert("❌ Impossible de supprimer l'annonce. Vérifie les règles Firestore.");
    }
  };
  // Charger les annonces au démarrage.
  chargerAnnonces();

</script>
      

</body>
</html>
