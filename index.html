<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalo-Guinée</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f6f5;
}

header {
  background: #087f3e;
  color: white;
  padding: 25px 15px;
  text-align: center;
}

.search {
  margin-top: 20px;
}

input {
  width: 75%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
}

.container {
  padding: 20px;
}

.card {
  background: white;
  padding: 18px;
  margin-bottom: 15px;
  border-radius: 15px;
  box-shadow: 0 2px 8px #0002;
}

.card h3 {
  margin-top: 0;
}

.price {
  color: #087f3e;
  font-weight: bold;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>🇬🇳 Kalo-Guinée</h1>
  <p>Acheter et vendre en Guinée</p>

  <div class="search">
    <input
      id="search"
      type="text"
      placeholder="Rechercher..."
      oninput="rechercher()"
    >
  </div>
</header>

<div class="container">

  <div class="card annonce">
    <h3>📱 iPhone</h3>
    <p class="price">5 000 000 GNF</p>
    <p>📍 Conakry</p>
  </div>

  <div class="card annonce">
    <h3>🚗 Voiture</h3>
    <p class="price">Prix à discuter</p>
    <p>📍 Conakry</p>
  </div>

  <div class="card annonce">
    <h3>🏠 Maison à louer</h3>
    <p class="price">3 000 000 GNF</p>
    <p>📍 Lambanyi</p>
  </div>

  <div class="card annonce">
    <h3>👕 Vêtements</h3>
    <p class="price">150 000 GNF</p>
    <p>📍 Madina</p>
  </div>

</div>

<script>
function rechercher() {

  let recherche = document
    .getElementById("search")
    .value
    .toLowerCase();

  let annonces = document.querySelectorAll(".annonce");

  annonces.forEach(function(annonce) {

    let texte = annonce.innerText.toLowerCase();

    if (texte.includes(recherche)) {
      annonce.classList.remove("hidden");
    } else {
      annonce.classList.add("hidden");
    }

  });
}
</script>

</body>
</html>
